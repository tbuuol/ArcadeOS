[package]
name = "meshd"
version = "0.1.0"
edition = "2021"
description = "ArcadeOS Mesh-Dienst: spricht das Arcade-Mesh-Protokoll v2 (docs/mesh-protocol.md)"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
chacha20poly1305 = "0.10"
blake2b_simd = "1"
rand = "0.8"
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
