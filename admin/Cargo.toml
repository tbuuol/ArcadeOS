[package]
name = "arcadeos-admin"
version = "0.1.0"
edition = "2021"
description = "ArcadeOS-Admin: Einrichtung der Arcade (Betreiber-Konto, @name auf Pepecoin-Testnet, Besitz-Nachweis)"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
tiny_http = "0.12"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
