# ArcadeOS – GRUB (x86_64 UEFI)
#
# A/B-Slots, gesteuert ueber grubenv (gleicher Ordner):
#   slot=A|B     fester Slot
#   try_slot=B   einmaliger Probeboot: wird VOR dem Start geloescht. Bestaetigt das neue System
#                sich nicht (setzt slot=B), bootet der naechste Neustart wieder den festen Slot.
# Der Pi nutzt dasselbe Prinzip mit tryboot.txt / os_prefix.

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=0

set slot=A
set try_slot=
load_env --skip-sig slot try_slot

set boot_slot="$slot"
if [ -n "$try_slot" ]; then
	set boot_slot="$try_slot"
	set try_slot=
	save_env try_slot
fi

if [ "$boot_slot" = "B" ]; then
	set other_slot=A
else
	set boot_slot=A
	set other_slot=B
fi
# Menueintraege laufen in eigenem Kontext und sehen nur exportierte Variablen
export boot_slot
export other_slot

# Faellt der gewaehlte Slot aus (z.B. Kernel fehlt), startet GRUB den anderen
set default=0
set fallback=1

function arcadeos_boot {
	if [ "$1" = "B" ]; then set part=rootfs-b; set kdir=/b; else set part=rootfs-a; set kdir=/a; fi
	linux $kdir/bzImage root=PARTLABEL=$part rootfstype=squashfs ro rootwait console=ttyS0 quiet arcadeos.slot=$1
}

menuentry "ArcadeOS $boot_slot" {
	arcadeos_boot $boot_slot
}

menuentry "ArcadeOS $other_slot (Fallback)" {
	arcadeos_boot $other_slot
}
