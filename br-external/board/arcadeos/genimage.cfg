# ArcadeOS Disk-Layout (GPT), gemeinsam fuer x86_64 (UEFI) und spaeter Raspberry Pi 4/5.
# Die Partitionsnamen sind fest: GRUB/Kernel booten root=PARTLABEL=rootfs-a|rootfs-b,
# S00state sucht die Partition "state".
#
#   boot      FAT32/ESP: EFI/BOOT (GRUB, grubenv), a/ und b/ (Kernel pro Slot);
#             spaeter zusaetzlich Pi-Firmware, config.txt, tryboot.txt
#   rootfs-a  System A (squashfs)
#   rootfs-b  System B (squashfs), anfangs leer
#   state     ext4, Zustand

image boot.vfat {
	vfat {
		label = "BOOT"
		files = { "efi-part/EFI" }
		file a/bzImage { image = "bzImage" }
	}
	size = 128M
}

image state.ext4 {
	empty = true
	temporary = true
	size = 128M
	ext4 {
		label = "state"
		use-mke2fs = true
	}
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "boot.vfat"
		partition-type-uuid = "U"
		bootable = true
	}

	partition rootfs-a {
		image = "rootfs.squashfs"
		size = 512M
	}

	partition rootfs-b {
		size = 512M
	}

	partition state {
		image = "state.ext4"
	}
}
