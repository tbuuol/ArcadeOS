# ArcadeOS Disk-Layout (GPT), gemeinsam fuer x86_64 (UEFI und BIOS) und spaeter Raspberry Pi 4/5.
# Die Partitionsnamen sind fest: GRUB/Kernel booten root=PARTLABEL=rootfs-a|rootfs-b,
# S00state sucht die Partition "state". Nummern spielen keine Rolle (ausser hd0,gpt2 fuer GRUB-BIOS).
#
#   (Sektor 0) Startcode fuer BIOS-PCs (GRUB boot.img), springt nach bios-boot
#   bios-boot GRUB-Kern fuer BIOS-PCs (grub.img), ohne Dateisystem
#   boot      FAT32/ESP: EFI/BOOT (GRUB, grubenv), a/ und b/ (Kernel pro Slot);
#             spaeter zusaetzlich Pi-Firmware, config.txt, tryboot.txt
#   rootfs-a  System A (squashfs)
#   rootfs-b  System B (squashfs), anfangs leer
#   arcadeos  FAT, "Basic Data": SSH-Key (authorized_keys.txt) und WLAN (wifi.txt). Windows, Mac und
#             Linux zeigen sie sofort als Laufwerk ARCADEOS (die ESP "boot" verstecken sie).
#   state     ext4, Zustand; auf dem Stick beim ersten Start bis ans Ende vergroessert (S00state)

image boot.vfat {
	vfat {
		label = "BOOT"
		files = { "efi-part/EFI" }
		file a/bzImage { image = "bzImage" }
	}
	size = 128M
}

image config.vfat {
	vfat {
		label = "ARCADEOS"
		file LIESMICH.txt { image = "LIESMICH.txt" }
		file README.txt { image = "README.txt" }
	}
	size = 16M
}

image state.ext4 {
	empty = true
	temporary = true
	size = 128M
	ext4 {
		label = "state"
		use-mke2fs = true
	}
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
		# auf 1 MB ausgerichtet: USB-Sticks, SD-Karten und SSDs schreiben in ganzen Bloecken
		align = 1M
	}

	# Startcode im ersten Sektor; 440-512 bleibt frei fuer die Schutz-MBR der GPT
	partition mbr {
		in-partition-table = "no"
		image = "boot-mbr.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	# BIOS-Boot-Partition (Typ 21686148-...): muss bei 1 MiB liegen, post-image.sh traegt das ein
	partition bios-boot {
		image = "grub.img"
		partition-type-uuid = "21686148-6449-6e6f-744e-656564454649"
		offset = 1M
		size = 1M
	}

	partition boot {
		image = "boot.vfat"
		partition-type-uuid = "U"
		bootable = true
	}

	partition rootfs-a {
		image = "rootfs.squashfs"
		size = 512M
	}

	partition rootfs-b {
		size = 512M
	}

	# Microsoft Basic Data: bekommt unter Windows einen Laufwerksbuchstaben
	partition arcadeos {
		image = "config.vfat"
		partition-type-uuid = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
	}

	partition state {
		image = "state.ext4"
	}
}
