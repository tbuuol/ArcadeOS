# ArcadeOS Disk-Layout (QEMU/VPS): GPT mit zwei System-Slots und Zustands-Partition.
# Die Partitionsnamen sind fest: der Kernel bootet root=PARTLABEL=rootfs-a,
# S00state sucht die Partition "state".

image state.ext4 {
	empty = true
	temporary = true
	size = 128M
	ext4 {
		label = "state"
		use-mke2fs = true
	}
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition rootfs-a {
		image = "rootfs.squashfs"
		size = 128M
	}

	# Slot B: wird bei Updates beschrieben (A/B), anfangs leer
	partition rootfs-b {
		size = 128M
	}

	partition state {
		image = "state.ext4"
	}
}
