# ArcadeOS Netztuning
# BBR statt CUBIC: haelt die Warteschlange im Router/Modem kurz (wichtig bei langsamem Upload)
net.ipv4.tcp_congestion_control = bbr
# fq: faire Warteschlange pro Verbindung, mit Pacing (passt zu BBR)
net.core.default_qdisc = fq
# Hoechstens 16 KB ungesendete Daten im Socket-Puffer: kleine Nachrichten (Mesh-Raeume)
# warten nicht hinter Megabytes an Bulk-Daten, die Anwendung kann selbst priorisieren
net.ipv4.tcp_notsent_lowat = 16384
